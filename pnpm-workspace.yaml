packages:
  - 'packages/*'

# pnpm requires an explicit decision on every dependency postinstall script.
# esbuild's links its platform binary; it arrives via webpack's minimizer.
allowBuilds:
  esbuild: true
  # workerd's postinstall links the platform-specific runtime binary; without
  # it the Workers test pool has no runtime to start.
  workerd: true

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
