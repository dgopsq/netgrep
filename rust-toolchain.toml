# Pinned deliberately, not floating on `stable`.
#
# The repository was previously on `channel = "stable"`, which meant an
# unrelated Rust release could — and did — break the build with no commit to
# point at: Rust 1.82 changed the wasm C ABI, and the `wasm-bindgen 0.2.82`
# pinned at the time could not cope. Pinning makes the build reproducible and
# turns a version move into a deliberate, reviewable commit.
#
# `pnpm lint` runs clippy, and a pinned toolchain is installed bare, so the
# component has to be requested explicitly.
#
# See docs/plans/MODERNIZATION.md — decisions 5 and 9.
[toolchain]
channel = "1.97.1"
targets = ["wasm32-unknown-unknown"]
components = ["clippy"]
