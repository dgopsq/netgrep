on:
  # Called by release.yml after publish-search.yml has finished: `workspace:*`
  # resolves to an exact version at pack time, so this package does not install
  # until that one is on npm. Also runnable by hand — see publish-search.yml for
  # why re-running release.yml is not a retry.
  workflow_call:
  workflow_dispatch:

name: Publish @netgrep/netgrep

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Provenance: npm records which workflow, commit and repository built this
      # tarball, checkable afterwards with `npm audit signatures`.
      id-token: write

    steps:
      # No test gate here either; release.yml runs the whole graph before
      # anything is tagged. See publish-search.yml. That does leave the manual
      # trigger as a button that publishes whatever ref was picked, so the ref
      # is checked instead.
      - name: Refuse a manual run from anywhere but main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo '::error::Manual publish is only allowed from main, not ${{ github.ref }}.'
          exit 1

      - uses: actions/checkout@v4

      # Rebuilt rather than taken from the test workflow's `wasm-pkg` artefact —
      # see the note in publish-search.yml. The WASM is needed even though this
      # publishes the TypeScript package: `pnpm build` compiles against
      # `@netgrep/search`, which resolves to this workspace.
      - uses: ./.github/actions/rust
        with:
          cache-key: wasm
      - uses: ./.github/actions/node
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - run: pnpm build:wasm
      - run: pnpm build

      # v3's default `strategy: upgrade` is what `greater-version-only: true`
      # meant on v1, so a re-run over an already-published version is a no-op
      # rather than a failure. The input was renamed, not dropped.
      - uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          provenance: true
          # Hand-written manifest; the Nx tsc executor used to synthesise one
          # into dist/.
          package: ./packages/netgrep/package.json
