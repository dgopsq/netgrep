on:
  push:
    tags:
      - search-**

name: Publish @netgrep/search

permissions:
  contents: read

jobs:
  # Runs the whole split job graph. `needs` below gates on the called workflow
  # as a whole, so a job added there gates this one too, with nothing to change
  # here.
  test-and-lint:
    uses: ./.github/workflows/test-and-lint.yml

  publish:
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Rebuilt here rather than taken from the `wasm-pkg` artefact the test
      # workflow uploaded. The artefact would be the exact bytes that passed,
      # which is a real argument for using it; against that, a release should
      # not depend on an inter-job hand-off staying wired up, and the build is
      # deterministic and cached. Rebuilt, deliberately.
      - uses: ./.github/actions/rust
        with:
          cache-key: wasm
      - uses: ./.github/actions/node
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - run: pnpm build:wasm

      - uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
          access: public
          greater-version-only: true
          # The hand-written wrapper manifest is what gets published, not the
          # one wasm-pack generates into pkg/. Its version is synced from
          # Cargo.toml by scripts/post_build.js.
          package: ./packages/search/package.json
