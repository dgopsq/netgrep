on:
  # Called by release.yml when ANY component released. This used to fire on
  # every push to main, which meant the published demo ran unreleased code and
  # its Scope section could describe a library no one could install. It now
  # deploys what was just released.
  workflow_call:
  # So a failed deploy can be retried, and the site can be re-published from
  # main without an empty commit.
  workflow_dispatch:

name: Deploy demo to GitHub Pages

# Serves https://netgrep.diegopasquali.com. That domain is configured in the
# repository settings (Settings -> Pages -> Custom domain) and in DNS, NOT here:
# a deployment driven by a workflow ignores a CNAME file in the artefact, so
# there deliberately is not one in packages/example/public/. See
# docs/decisions/0017-example-as-hosted-demo.md.

permissions:
  contents: read

# GitHub Pages allows one deployment at a time. `cancel-in-progress: false`
# rather than true: cancelling a half-finished deployment is how a site ends up
# serving a partial upload, and the queue here is never more than one deep.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `pages` and `id-token` are what `deploy-pages` needs to mint its OIDC
    # token, declared on the job so the rest of a caller's run does not get them.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # No test gate here: release.yml runs the whole graph before release-please
      # tags, and the guard below is what that costs.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/require-main

      # The WASM is rebuilt rather than taken from the test workflow's
      # `wasm-pkg` artefact, for the reason recorded in publish-search.yml.
      - uses: ./.github/actions/rust
        with:
          cache-key: wasm
      - uses: ./.github/actions/node
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - run: pnpm build:wasm
      # The demo imports `@netgrep/netgrep`, which resolves to this workspace
      # and points at `dist/` — a gitignored build output. Without this the
      # Vite build fails to resolve the package.
      - run: pnpm build
      - run: pnpm build:example

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/example/dist

      - id: deployment
        uses: actions/deploy-pages@v4
