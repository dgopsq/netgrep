on:
  push:
    branches:
      - main
  # So a failed deploy can be retried, and the site can be re-published from
  # main without an empty commit.
  workflow_dispatch:

name: Deploy demo to GitHub Pages

permissions:
  contents: read

# GitHub Pages allows one deployment at a time. `cancel-in-progress: false`
# rather than true: cancelling a half-finished deployment is how a site ends up
# serving a partial upload, and the queue here is never more than one deep.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates the deploy on the whole test graph. `needs` below depends on the
  # called workflow as a whole, so a job added there gates this one too, with
  # nothing to change here — the same arrangement the two publish workflows use.
  test-and-lint:
    uses: ./.github/workflows/test-and-lint.yml

  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `pages` and `id-token` are what `deploy-pages` needs to mint its OIDC
    # token; they are scoped to this job so the test workflow above does not
    # run with them.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The WASM is rebuilt rather than taken from the test workflow's
      # `wasm-pkg` artefact, for the reason recorded in publish-search.yml.
      - uses: ./.github/actions/rust
        with:
          cache-key: wasm
      - uses: ./.github/actions/node
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - run: pnpm build:wasm
      # The demo imports `@netgrep/netgrep`, which resolves to this workspace
      # and points at `dist/` — a gitignored build output. Without this the
      # Vite build fails to resolve the package.
      - run: pnpm build
      - run: pnpm build:example

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/example/dist

      - id: deployment
        uses: actions/deploy-pages@v4
