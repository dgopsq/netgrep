on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

name: Test and lint workflow

jobs:
  test_and_lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          # Must match rust-toolchain.toml. See docs/plans/MODERNIZATION.md.
          toolchain: 1.81.0
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@v3
        with:
          node-version: '18.7.0'
          cache: 'yarn'
      - run: yarn
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: yarn nx run-many --target=lint
      # The netgrep integration tests drive the real WASM engine, which needs a
      # Node-loadable build. The published `pkg/` uses wasm-pack's bundler
      # target and cannot be required directly.
      - run: yarn nx build-node search
      - run: yarn nx run-many --target=test
