on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

name: Test and lint workflow

# A superseded run has nothing left to tell us, so cancel it — but only on pull
# requests. A push to `main` and a release tag both arrive as `push`, and those
# runs are gates rather than feedback; cancelling one would report a green
# commit that was never fully checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ONE JOB PER FAILURE MODE
# ------------------------
# This was a single job running eight commands in sequence, which had two
# costs. A red build said "Test and lint failed" and you opened the log to find
# out what; and a clippy warning in the first minute hid every later result,
# because nothing after it ran.
#
# Split, each check reports under its own name and they run at once. The WASM is
# the one thing more than one of them needs, so it is built once and passed
# along as an artefact — the alternative is three jobs each installing wasm-pack
# and recompiling the ripgrep tree to produce identical bytes.
#
# The jobs that need nothing from Rust at all — Biome, and the unit suite, which
# mocks the engine (AGENTS.md §2.2) — do not wait for it.
jobs:
  # Built first because three jobs below need `packages/search/pkg`, which is a
  # gitignored build output: `@netgrep/netgrep` resolves `@netgrep/search` to
  # this workspace, so typecheck, build and the integration tests all fail
  # without it.
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: wasm
      - uses: ./.github/actions/node
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - run: pnpm build:wasm

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/search/pkg
          # `pkg/` is reproduced from source by every job that needs it; it is
          # a hand-off between jobs in one run, not something to keep.
          retention-days: 1
          # An empty upload here would surface as a confusing failure three jobs
          # later, when the download produced nothing.
          if-no-files-found: error

  lint-js:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - run: pnpm lint:js

  lint-rust:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          # Clippy's own dev-profile artefacts, shared with nothing else.
          cache-key: clippy
      - uses: ./.github/actions/node
      - run: pnpm lint:rust

  # Native `cargo test` — no browser, no WebDriver, and no WASM: it links the
  # crate for the host. See decision 0013.
  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: cargo-test
      - uses: ./.github/actions/node
      - run: pnpm test:rust

  # Mocks `fetch` and the engine, so it needs neither the WASM nor a browser and
  # starts immediately. In practice this is the check that fails first.
  test-unit:
    name: Test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - run: pnpm test:unit

  test-browser:
    name: Test (browser)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/search/pkg

      # The browser is Playwright's own Chromium, pinned to the `playwright`
      # version in the lockfile, so it cannot drift from the thing driving it —
      # which is exactly what ChromeDriver used to do. Only chromium is
      # downloaded; firefox and webkit are not used.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

  typecheck:
    name: Typecheck
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/search/pkg
      - run: pnpm typecheck

  # `pnpm build` and `pnpm verify:pack` belong together: everything else here
  # inspects the working tree, while this pair produces the tarballs that would
  # actually reach npm and then inspects those — the only artefact users ever
  # see, and once the only one nothing checked.
  package:
    name: Package
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/search/pkg
      - run: pnpm build
      - run: pnpm verify:pack

  # One check to require on the branch, and one for `workflow_call` callers to
  # depend on, so that neither has to be edited when a job is added above.
  ci:
    name: CI
    if: always()
    needs:
      - wasm
      - lint-js
      - lint-rust
      - test-rust
      - test-unit
      - test-browser
      - typecheck
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo '${{ toJSON(needs) }}'

      # `always()` means this job runs even when a dependency failed, so it has
      # to inspect the results rather than rely on being skipped. `skipped`
      # counts as a failure: a job is skipped here only because something it
      # needed — the WASM build — did not succeed.
      - name: Fail if any job did not succeed
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo '::error::At least one job did not succeed.'
          exit 1
