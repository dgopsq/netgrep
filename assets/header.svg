<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-label="net | grep — grep over HTTP, running in the browser.">
  <defs>
    <!-- Card background: near-black with a faint teal glow in the top-right, as in the original header. -->
    <radialGradient id="glow" cx="0.85" cy="0.1" r="1.1">
      <stop offset="0" stop-color="#10201d" />
      <stop offset="0.55" stop-color="#0b100f" />
      <stop offset="1" stop-color="#0a0b0c" />
    </radialGradient>
    <!-- Wordmark fade, white on the left into the site's primary teal on the right. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="390" y1="0" x2="1410" y2="0">
      <stop offset="0" stop-color="#f4f6f5" />
      <stop offset="0.4" stop-color="#e9eeec" />
      <stop offset="0.8" stop-color="#2ee0c9" />
    </linearGradient>
  </defs>
  <rect width="1800" height="520" rx="48" fill="url(#glow)" />
  <text font-family="JetBrains Mono" font-weight="700" font-size="170" text-anchor="middle" x="900" y="248">
    <!-- No spaces around the pipe: rsvg-convert, which renders the PNG beside
         this file, strips them under xml:space="default", so the committed
         artwork is `net|grep` and the spaces only ever showed in a browser. -->
    <tspan fill="url(#fade)">net</tspan><tspan fill="#2ee0c9">|</tspan><tspan fill="url(#fade)">grep</tspan>
  </text>
  <text font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-weight="500" font-size="48" text-anchor="middle" x="900" y="368" xml:space="preserve">
    <tspan fill="#c9d1ce">grep over HTTP, </tspan><tspan fill="#2ee0c9">running in the browser.</tspan>
  </text>
</svg>
